version: '3.8'

services:
  mongo:
    image: mongo:latest
    container_name: familycare_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: familycare_backend
    ports:
      - "5000:5000"
    environment:
      MONGODB_URI: mongodb://admin:password@mongo:27017/family_healthcare?authSource=admin
      JWT_SECRET: test_jwt_secret_change_in_production
      PORT: 5000
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      - mongo
    volumes:
      - ./Backend/server:/app/Backend/server

volumes:
  mongo_data:
